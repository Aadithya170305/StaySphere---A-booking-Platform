name: CI/CD Pipeline - StaySphere

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install

      - name: Check app starts without errors
        run: node -e "require('./app.js')" &
        continue-on-error: true
  docker:
    runs-on: ubuntu-latest
    needs: build       
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t aadithya1234/staysphere-app:latest .

      - name: Push App image to Docker Hub
        run: docker push aadithya1234/staysphere-app:latest

      - name: Push Seed image to Docker Hub
        run: |
          docker tag aadithya1234/staysphere-app:latest aadithya1234/staysphere-seed:latest
          docker push aadithya1234/staysphere-seed:latest
  notify:
    runs-on: ubuntu-latest
    needs: docker       
    steps:
      - name: Print success message
        run: |
          echo "✅ CI/CD Pipeline completed successfully!"
          echo "🐳 Images pushed to Docker Hub"
          echo "🚀 App: https://hub.docker.com/r/aadithya1234/staysphere-app"